[package]
name = "twkb-fuzz"
version = "0.0.0"
description = "Fuzz targets of the twkb crate"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Its own workspace: cargo-fuzz builds it with nightly and sanitizers, apart from the crates
[workspace]

[lib]
name = "twkb_fuzz"
path = "src/lib.rs"

[[bin]]
name = "read"
path = "fuzz_targets/read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "write"
path = "fuzz_targets/write.rs"
test = false
doc = false
bench = false

[dependencies]
arbitrary = { version = "1.4", features = ["derive"] }
geo-traits = { version = "0.3", default-features = false, features = ["geo-types"] }
geo-types = { version = "0.7.20", default-features = false, features = ["arbitrary", "std"] }
libfuzzer-sys = "0.4"
twkb = { path = ".." }

[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
