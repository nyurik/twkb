allow-mixed-uninlined-format-args = false
allow-unwrap-in-tests = true
avoid-breaking-exported-api = false

disallowed-methods = [
    "alloc::boxed::Box::leak",
    "alloc::vec::Vec::leak",
    "std::boxed::Box::leak",
    "std::vec::Vec::leak",
]
# Names the docs use as words: `..` keeps clippy's own list
doc-valid-idents = ["PostGIS", ".."]
